  <text x="256" y="292" text-anchor="middle" font-family="Fraunces" font-size="104" font-weight="500" letter-spacing="2" fill="#f3eee8" style="font-variation-settings:'SOFT' 100">N<tspan font-weight="300" font-size="88" dx="2" dy="-2" fill="#e9a9a6">&amp;</tspan><tspan dx="2" dy="2">B</tspan></text>
